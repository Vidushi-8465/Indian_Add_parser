# Data Ingestion Configuration

paths:
  raw_csv_dir: datasets/raw/csv
  raw_excel_dir: datasets/raw/excel
  master_dataset: datasets/master/master_dataset.csv
  master_metadata: datasets/master/master_metadata.json

discovery:
  csv_extensions: [".csv"]
  excel_extensions: [".xlsx", ".xls"]
  recursive: true

reading:
  max_header_scan_rows: 15
  encodings: ["utf-8", "utf-8-sig", "latin-1", "cp1252"]
  csv_read_chunksize: null  # null = read entire file

standard_columns:
  - serial_number
  - pincode
  - state_code
  - state_name
  - district_code
  - district_name
  - city_name
  - locality
  - locality_code
  - block_code
  - block_name
  - road_name
  - building_name
  - office_name
  - office_type
  - delivery_status
  - urban_status
  - region_name
  - division_name
  - circle_name
  - latitude
  - longitude
  - census_code
  - source_file

